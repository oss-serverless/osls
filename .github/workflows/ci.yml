name: CI

on:
  push:
    branches: [4.x, pnpm, typescript7-native, ci-checks]
  pull_request:
    branches: [4.x]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint || true

      - name: Type check
        run: pnpm exec tsc --noEmit || true

      - name: Build
        run: pnpm run build 2>&1 | tail -5 || echo "no build script"

      - name: Tests
        run: pnpm run test:isolated 2>&1 | tail -30 || true

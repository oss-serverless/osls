name: Release

on:
  # This job runs when a new release is published
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  prePublishPackageTest:
    name: Prepublish package test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Store the name of the release
      # See https://stackoverflow.com/questions/58177786/get-the-current-pushed-tag-in-github-actions
      - run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - run: npm version $RELEASE_VERSION --no-git-tag-version

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        # Some tests depend on TTY support, which is missing in GA runner
        run: script -e -c "pnpm run test --bail"

      # dist/ is the published package root, with a package.json generated from the root one
      - name: Build
        run: pnpm run build

      - name: Verify package contents
        run: npm pack ./dist --dry-run

      - name: Build publish tarball
        run: echo "PACKAGE_TGZ=$(npm pack ./dist --silent)" >> $GITHUB_ENV

      - name: Smoke test the packed package
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cp -R test/fixtures/programmatic/function/. "$RUNNER_TEMP/consumer"
          PACKAGE_PATH="$(pwd)/$PACKAGE_TGZ"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$PACKAGE_PATH"
          npx osls --version
          npx osls print

      - name: Upload tested tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ env.PACKAGE_TGZ }}
          if-no-files-found: error

  npmPublish:
    name: Publish to NPM
    needs: prePublishPackageTest
    runs-on: ubuntu-latest
    steps:
      - name: Download tested tarball
        uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Install Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Resolve npm dist-tag
        run: |
          RELEASE_VERSION=${GITHUB_REF#refs/*/}
          PACKAGE_VERSION=${RELEASE_VERSION#v}

          case "$PACKAGE_VERSION" in
            *-alpha.*) NPM_TAG=alpha ;;
            *-beta.*) NPM_TAG=beta ;;
            *-rc.*) NPM_TAG=rc ;;
            *) NPM_TAG=latest ;;
          esac

          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"

      - name: Publish new version
        run: npm publish ./*.tgz --access public --tag="$NPM_TAG"
